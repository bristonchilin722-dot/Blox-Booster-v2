name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d. -f1)
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not detect active Java version."
            exit 1
          fi
          echo "Detected active Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version must be 17 or newer. Found: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at $EXPECTED_APK."
            echo "Searching only inside app/build/outputs/apk for discovered APKs:"
            find app/build/outputs/apk -maxdepth 4 -type f -name "*.apk" || true
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: $EXPECTED_APK does not have the .apk extension."; exit 1 ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: APK path does not match app/build/outputs/apk/debug/app-debug.apk exactly."
            exit 1
          fi

          echo "Verified APK successfully: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_ASSET_DIR=$(mktemp -d -t apk-release-XXXXXX)
          REPO_RAW="${{ github.repository }}"
          REPO_NAME=$(basename "$REPO_RAW")
          REPO_SAFE=$(echo "$REPO_NAME" | tr -cs 'a-zA-Z0-9_-' '-' | sed 's/^-//;s/-$//' | tr '[:upper:]' '[:lower:]')
          if [ -z "$REPO_SAFE" ]; then
            REPO_SAFE="app"
          fi
          RELEASE_FILENAME="${REPO_SAFE}-debug-build-${{ github.run_number }}.apk"
          DEST_APK="${TEMP_ASSET_DIR}/${RELEASE_FILENAME}"
          cp "$SRC_APK" "$DEST_APK"

          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "Error: Prepared release asset is missing or empty."
            exit 1
          fi

          echo "Prepared release asset: $DEST_APK"
          echo "release_asset_path=$DEST_APK" >> "$GITHUB_OUTPUT"
          echo "release_filename=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.release_asset_path }}"
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset validation failed before release creation."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "Error: Asset does not end with .apk"; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          ### Blox Booster - Debug APK Build #${{ github.run_number }}

          - **Build Type**: Automatically generated debug APK
          - **Built by**: GitHub Actions
          - **Run Number**: #${{ github.run_number }}
          - **Run Attempt**: #${{ github.run_attempt }}
          - **Commit SHA**: \`${{ github.sha }}\`
          - **Notice**: This APK is intended for testing and development.
          - **Signing**: Signed with a temporary debug keystore (not a Play Store production release).

          Download the \`.apk\` directly below under **Assets** to install on your Android device.
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          RELEASE_FILENAME="${{ steps.prepare_asset.outputs.release_filename }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "================================================="
            echo "GitHub Release Publishing SUCCEEDED!"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "APK Asset Filename: $RELEASE_FILENAME"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}")
            echo "Release Page URL: $RELEASE_URL"
            echo "================================================="

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Debug APK Published to GitHub Releases!

          - **Release Title**: $RELEASE_TITLE
          - **Release Tag**: \`$RELEASE_TAG\`
          - **APK Asset Filename**: \`$RELEASE_FILENAME\`
          - **Direct Release Page**: [$RELEASE_URL]($RELEASE_URL)

          > 📱 **How to download on your phone**: Visit the [Release Page]($RELEASE_URL) and download \`$RELEASE_FILENAME\` directly from the **Assets** section.
          >
          > 📦 *Backup*: The standard Actions artifact \`app-debug-apk\` is also available under the workflow summary.
          EOF
          else
            echo "================================================="
            echo "WARNING: GitHub Release publishing could not be completed."
            echo "The Debug APK was built successfully and is preserved as an Actions artifact."
            echo "Actions Artifact Name: app-debug-apk"
            echo "================================================="

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ GitHub Release Notice

          - **APK Build Status**: ✅ Succeeded
          - **Actions Artifact**: ✅ \`app-debug-apk\` is available under the workflow summary.
          - **Release Publishing**: ⚠️ Release creation did not complete (e.g. check repository permissions).
          - **How to download**: You can download \`app-debug-apk\` directly from the **Artifacts** section at the bottom of this Actions run page.
          EOF
          fi
